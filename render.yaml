// Render 配置文件（Java 后端）
// 说明：原 Node 后端已替换为 java-server/ 的 Java 实现
services:
  - type: web
    name: attendance-system-api
    env: java
    buildCommand: cd java-server && mvn -DskipTests clean package
    startCommand: cd java-server && java -jar target/attendance-server.jar
    envVars:
      - key: JAVA_VERSION
        value: "8"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 3000
      # 生产 MySQL 连接（替换为你的实际值）
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: root
      - key: DB_NAME
        value: attendance_db
      - key: JWT_SECRET
        value: attendance-system-secret-key-change-me
